<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التقارير — GT Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:30px;flex-wrap:wrap}
.tab{background:var(--surface);border:2px solid var(--border);color:var(--muted);padding:12px 28px;border-radius:12px;font-weight:800;font-size:1rem;cursor:pointer;transition:all .2s;font-family:inherit}
.tab:hover{border-color:var(--primary);color:var(--text)}
.tab.active{background:var(--primary);color:#0B1220;border-color:var(--primary)}
.period{display:none}
.period.active{display:block}
.stats-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;text-align:center}
.stat-card .num{font-size:2rem;font-weight:900;color:var(--primary)}
.stat-card .label{color:var(--muted);font-size:.85rem;margin-top:4px}
.stat-card.win .num{color:var(--success)}
.stat-card.loss .num{color:var(--danger)}
.report-section{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
.report-section h3{margin-bottom:16px;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.trade-list{display:grid;gap:12px}
.trade{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surfaceAlt);border:1px solid var(--border);border-radius:12px;padding:14px 16px;transition:all .15s}
.trade:hover{border-color:rgba(247,147,26,.4)}
.trade-type{padding:4px 12px;border-radius:8px;font-size:.78rem;font-weight:800;text-transform:uppercase}
.trade-type.buy{background:rgba(34,197,94,.15);color:var(--success)}
.trade-type.sell{background:rgba(239,68,68,.15);color:var(--danger)}
.trade-info{display:flex;flex-direction:column;gap:2px}
.trade-symbol{font-weight:800;font-size:1rem}
.trade-meta{color:var(--muted);font-size:.82rem}
.trade-status{padding:4px 12px;border-radius:8px;font-size:.78rem;font-weight:800}
.trade-status.pending{background:rgba(247,147,26,.12);color:var(--primary)}
.trade-status.win{background:rgba(34,197,94,.15);color:var(--success)}
.trade-status.loss{background:rgba(239,68,68,.15);color:var(--danger)}
.no-data{text-align:center;padding:60px 20px;color:var(--muted)}
.no-data .ico{font-size:3rem;margin-bottom:12px}
.day-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.day-header h4{color:var(--text);font-size:1rem}
.day-header .count{color:var(--primary);font-weight:800;font-size:.9rem}
.loading{text-align:center;padding:40px;color:var(--muted)}
.loading::after{content:"";display:inline-block;width:20px;height:20px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-right:10px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:60px 20px;background:var(--surface);border:1px solid var(--border);border-radius:16px}
.empty-state .ico{font-size:3.5rem;margin-bottom:16px}
.empty-state h3{margin-bottom:8px}
.empty-state p{color:var(--muted)}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">GT Group</a>
  <div class="links">
    <a href="index.html">الرئيسية</a>
    <a href="about.html">من نحن</a>
    <a href="download.html">تحميل التطبيق</a>
    <a href="subscribe.html">الاشتراك</a>
    <a href="reports.html" class="on">التقارير</a>
  </div>
</nav>

<main>
  <div class="page-header">
    <h1>📊 التقارير <span class="g">ال LIVE</span></h1>
    <p>بيانات حية من السحابة — توصيات اليوم والأسبوع والشهر مع الإحصائيات</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('daily')">📅 يومي</button>
    <button class="tab" onclick="showTab('weekly')">📆 أسبوعي</button>
    <button class="tab" onclick="showTab('monthly')">🗓 شهري</button>
  </div>

  <div id="daily" class="period active">
    <div class="stats-grid" id="dailyStats"></div>
    <div id="dailyContent"><div class="loading">جاري تحميل البيانات...</div></div>
  </div>

  <div id="weekly" class="period">
    <div class="stats-grid" id="weeklyStats"></div>
    <div id="weeklyContent"><div class="loading">جاري تحميل البيانات...</div></div>
  </div>

  <div id="monthly" class="period">
    <div class="stats-grid" id="monthlyStats"></div>
    <div id="monthlyContent"><div class="loading">جاري تحميل البيانات...</div></div>
  </div>
</main>

<footer>GT Group &copy; 2026 — <b>المهندس أبو فهد</b> وفريق القناة · تابعنا: <a href="https://t.me/kingofintry" target="_blank" style="color:var(--primary);font-weight:800">تيليجرام</a></footer>

<script>
const SUPABASE_URL='https://ovxzubciqelsxqjrdght.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92eHp1YmNpcWVsc3hxanJkZ2h0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4ODI1NTgwNSwiZXhwIjoyMTAzODMxODA1fQ.WBeshyqZ_EAvP-3fUUGbA3CHsUDVSMFzwlkeU68TFWI';

async function fetchData(){
  try{
    const res=await fetch(SUPABASE_URL+'/rest/v1/recommendations?select=*&order=published_at.desc',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});
    return await res.json();
  }catch(e){return [];}
}

function showTab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.period').forEach(p=>p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(id).classList.add('active');
}

function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);d.setHours(0,0,0,0);return d;}
function weeksAgo(n){return daysAgo(n*7);}
function monthsAgo(n){const d=new Date();d.setMonth(d.getMonth()-n,1);d.setHours(0,0,0,0);return d;}

function filterTrades(trades,start,end){
  return trades.filter(t=>{
    const d=new Date(t.published_at);
    return d>=start&&d<=end;
  });
}

function stats(trades){
  const total=trades.length;
  const wins=trades.filter(t=>t.status==='win'||t.status==='won'||t.status==='نجحت').length;
  const losses=trades.filter(t=>t.status==='loss'||t.status==='lost'||t.status==='خسارة').length;
  const pending=trades.filter(t=>!t.status||t.status==='pending'||t.status==='open'||t.status==='active').length;
  const rate=total>0?Math.round((wins/total)*100):0;
  return {total,wins,losses,pending,rate};
}

function renderStats(container,s){
  container.innerHTML=
    <div class="stat-card"><div class="num"></div><div class="label">إجمالي الصفقات</div></div>
    <div class="stat-card win"><div class="num"></div><div class="label">ناجحة</div></div>
    <div class="stat-card loss"><div class="num"></div><div class="label">خاسرة</div></div>
    <div class="stat-card"><div class="num"></div><div class="label">قيد الانتظار</div></div>
    <div class="stat-card"><div class="num">%</div><div class="label">نسبة النجاح</div></div>
  ;
}

function renderTrade(t){
  const d=new Date(t.published_at);
  const date=d.toLocaleDateString('ar-KW',{weekday:'short',day:'numeric',month:'short'});
  const time=d.toLocaleTimeString('ar-KW',{hour:'2-digit',minute:'2-digit'});
  const typeClass=(t.type==='sell'||t.type==='short')?'sell':'buy';
  const statusClass=t.status==='win'||t.status==='won'?'win':t.status==='loss'||t.status==='lost'?'loss':'pending';
  const statusText=t.status==='win'||t.status==='won'?'✅ ناجحة':t.status==='loss'||t.status==='lost'?'❌ خسارة':'⏳ قيد الانتظار';
  return <div class="trade">
    <span class="trade-type "></span>
    <div class="trade-info">
      <span class="trade-symbol"></span>
      <span class="trade-meta"> · دخول:  · TP:  · SL:  ·  </span>
    </div>
    <span class="trade-status "></span>
  </div>;
}

function renderDayGroup(trades,dateStr){
  const dayTrades=trades.filter(t=>new Date(t.published_at).toLocaleDateString('ar-KW')===dateStr);
  if(dayTrades.length===0)return '';
  return <div class="report-section">
    <div class="day-header"><h4>📅 </h4><span class="count"> صفقة</span></div>
    <div class="trade-list"></div>
  </div>;
}

function renderWeekGroup(trades,weekStart,weekEnd,label){
  const weekTrades=filterTrades(trades,weekStart,weekEnd);
  if(weekTrades.length===0)return '';
  const s=stats(weekTrades);
  return <div class="report-section">
    <div class="day-header"><h4>📆 </h4><span class="count"> صفقة · % نجاح</span></div>
    <div class="trade-list"></div>
  </div>;
}

async function loadReports(){
  const trades=await fetchData();
  if(!trades||trades.length===0){
    ['dailyContent','weeklyContent','monthlyContent'].forEach(id=>{
      document.getElementById(id).innerHTML='<div class="empty-state"><div class="ico">📊</div><h3>لا توجد توصيات بعد</h3><p>ستظهر التوصيات هنا تلقائياً عند نشرها عبر القناة</p></div>';
    });
    return;
  }

  // Daily - last 7 days
  const dailyS=stats(filterTrades(trades,daysAgo(1),new Date()));
  renderStats(document.getElementById('dailyStats'),dailyS);
  let dailyHtml='';
  for(let i=0;i<7;i++){
    const day=new Date();day.setDate(day.getDate()-i);
    const label=day.toLocaleDateString('ar-KW',{weekday:'long',day:'numeric',month:'long'});
    dailyHtml+=renderDayGroup(trades,label);
  }
  document.getElementById('dailyContent').innerHTML=dailyHtml||'<div class="empty-state"><div class="ico">📅</div><h3>ما في صفقات اليوم</h3><p>تابع القناة عشان تشوف التوصيات الحية</p></div>';

  // Weekly - last 4 weeks
  const weeklyS=stats(filterTrades(trades,weeksAgo(4),new Date()));
  renderStats(document.getElementById('weeklyStats'),weeklyS);
  let weeklyHtml='';
  const now=new Date();
  for(let i=0;i<4;i++){
    const ws=weeksAgo(i);const we=i===0?new Date():weeksAgo(i-1);
    const label=i===0?'هذا الأسبوع':i===1?'الأسبوع الماضي':قبل  أسابيع;
    weeklyHtml+=renderWeekGroup(trades,ws,we,label);
  }
  document.getElementById('weeklyContent').innerHTML=weeklyHtml||'<div class="empty-state"><div class="ico">📆</div><h3>ما في صفقات هالأسبوع</h3></div>';

  // Monthly - last 3 months
  const monthlyS=stats(filterTrades(trades,monthsAgo(3),new Date()));
  renderStats(document.getElementById('monthlyStats'),monthlyS);
  let monthlyHtml='';
  for(let i=0;i<3;i++){
    const ms=monthsAgo(i);const me=i===0?new Date():monthsAgo(i-1);
    const monthName=ms.toLocaleDateString('ar-KW',{month:'long',year:'numeric'});
    monthlyHtml+=renderWeekGroup(trades,ms,me,monthName);
  }
  document.getElementById('monthlyContent').innerHTML=monthlyHtml||'<div class="empty-state"><div class="ico">🗓</div><h3>ما في صفقات هالشهر</h3></div>';
}

loadReports();
</script>
</body></html>
