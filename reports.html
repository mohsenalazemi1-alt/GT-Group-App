<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التقارير — GT Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:30px;flex-wrap:wrap}
.tab{background:var(--surface);border:2px solid var(--border);color:var(--muted);padding:12px 28px;border-radius:12px;font-weight:800;font-size:1rem;cursor:pointer;transition:all .2s;font-family:inherit}
.tab:hover{border-color:var(--primary);color:var(--text)}
.tab.active{background:var(--primary);color:#0B1220;border-color:var(--primary)}
.period{display:none}.period.active{display:block}
.stats-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;text-align:center}
.stat-card .num{font-size:2rem;font-weight:900;color:var(--primary)}
.stat-card .label{color:var(--muted);font-size:.82rem;margin-top:4px}
.stat-card.win .num{color:var(--success)}
.stat-card.loss .num{color:var(--danger)}
.report-section{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
.day-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.day-header h4{font-size:1rem}.day-header .count{color:var(--primary);font-weight:800;font-size:.85rem}
.trade{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surfaceAlt);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.trade:last-child{margin-bottom:0}
.trade-type{padding:4px 10px;border-radius:6px;font-size:.75rem;font-weight:800;text-transform:uppercase}
.trade-type.buy{background:rgba(34,197,94,.15);color:var(--success)}
.trade-type.sell{background:rgba(239,68,68,.15);color:var(--danger)}
.trade-symbol{font-weight:800;font-size:.95rem}
.trade-meta{color:var(--muted);font-size:.78rem}
.trade-status{padding:4px 10px;border-radius:6px;font-size:.75rem;font-weight:800}
.trade-status.pending{background:rgba(247,147,68,.12);color:var(--primary)}
.trade-status.win{background:rgba(34,197,94,.15);color:var(--success)}
.trade-status.loss{background:rgba(239,68,68,.15);color:var(--danger)}
.loading{text-align:center;padding:40px;color:var(--muted)}
.loading::after{content:"";display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:50px 20px;background:var(--surface);border:1px solid var(--border);border-radius:16px}
.empty-state .ico{font-size:3rem;margin-bottom:12px}
.empty-state h3{margin-bottom:6px}.empty-state p{color:var(--muted)}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">GT Group</a>
  <div class="links">
    <a href="index.html">الرئيسية</a>
    <a href="about.html">من نحن</a>
    <a href="download.html">تحميل التطبيق</a>
    <a href="subscribe.html">الاشتراك</a>
    <a href="library.html" class="on">مكتبة القناة</a>
  </div>
</nav>
<main>
  <div class="page-header">
    <h1>📊 التقارير <span class="g">ال LIVE</span></h1>
    <p>بيانات حية من السحابة — توصيات اليوم والأسبوع والشهر</p>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('daily')">يومي</button>
    <button class="tab" onclick="showTab('weekly')">أسبوعي</button>
    <button class="tab" onclick="showTab('monthly')">شهري</button>
  </div>
  <div id="daily" class="period active">
    <div class="stats-grid" id="dailyStats"></div>
    <div id="dailyContent"><div class="loading">جاري التحميل...</div></div>
  </div>
  <div id="weekly" class="period">
    <div class="stats-grid" id="weeklyStats"></div>
    <div id="weeklyContent"></div>
  </div>
  <div id="monthly" class="period">
    <div class="stats-grid" id="monthlyStats"></div>
    <div id="monthlyContent"></div>
  </div>
</main>
<footer>GT Group &copy; 2026 — <b>المهندس أبو فهد</b> وفريق القناة · تابعنا: <a href="https://t.me/kingofintry" target="_blank" style="color:var(--primary);font-weight:800">تيليجرام</a></footer>
<script src="reports.js"></script>
</body></html>
